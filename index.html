<body>

    <link
        href="https://cdn.jsdelivr.net/gh/jscastro76/threebox@v.2.2.2/dist/threebox.css"
        rel="stylesheet"
    />

    <script src="config.js"></script>

    <div id="map"></div>


    <script>

        /* =========================================================
           KANKA
           ========================================================= */

        const KANKA_ACCESS_TOKEN_KEY = "kankaAccessToken";


        /* =========================================================
           MAPBOX
           ========================================================= */

        mapboxgl.accessToken =
            "pk.eyJ1IjoiZml0emNoZXZhbHJpYyIsImEiOiJjazdzdXYzazUwazk0M2VtcnJ0N3BkZzY4In0.agcwn8WbpxmAVcXzzaXbsQ";


        const map = new mapboxgl.Map({

            container: "map",

            style:
                "mapbox://styles/fitzchevalric/clmj7x4rt01oz01r4h0j07f13",

            center: [-10, 40, 0],

            zoom: 5.4,

            pitch: 0,

            bearing: 0,

            antialias: true,

            maxBounds: [
                [-180, -90],
                [180, 90]
            ],

            maxPitch: 60,

            maxZoom: 22,

            minZoom: 1,

            renderWorldCopies: false

        });


        map.addControl(
            new mapboxgl.NavigationControl()
        );


        /* =========================================================
           TERRAIN + THREEBOX
           ========================================================= */

        map.on("style.load", () => {


            map.addSource("mapbox-dem", {

                type: "raster-dem",

                url:
                    "mapbox://fitzchevalric.68qxzm7k",

                tileSize: 256,

                maxzoom: 6,

                minzoom: 0

            });


            map.setTerrain({

                source: "mapbox-dem",

                exaggeration: 0.06

            });


            window.tb = new Threebox(

                map,

                map.getCanvas().getContext("webgl"),

                {

                    defaultLights: true,

                    sky: true,

                    enableSelectingObjects: false,

                    enableTooltips: true,

                    terrain: true,

                    projection: "globe"

                }

            );


            map.addLayer({

                id: "custom-threebox-model",

                type: "custom",

                projection: "globe",

                renderingMode: "3d",

                minZoom: 6,


                onAdd: function (map, gl) {


                    /* =========================
                       DIVAL
                       ========================= */

                    var options = {

                        obj:
                            "https://cdn.glitch.global/f74434fa-8946-4fcc-8584-781241e68fd4/scene.gltf?v=1717413150136",

                        type: "gltf",

                        scale: 250,

                        units: "scale",

                        rotation: {
                            x: 90,
                            y: 180,
                            z: 0
                        },

                        anchor: "centre"

                    };


                    tb.loadObj(
                        options,
                        (model) => {

                            model.setCoords(
                                [-6.98, 38.85, 13100.0000]
                            );

                            model.setRotation({
                                x: 0,
                                y: 0,
                                z: 241
                            });

                            tb.add(model);

                        }
                    );


                    /* =========================
                       STONEFRONT
                       ========================= */

                    var stonefrontOptions = {

                        obj:
                            "https://cdn.glitch.global/f74434fa-8946-4fcc-8584-781241e68fd4/scene.gltf?v=1717413150136",

                        type: "gltf",

                        scale: 250,

                        units: "scale",

                        rotation: {
                            x: 90,
                            y: 180,
                            z: 0
                        },

                        anchor: "centre"

                    };


                    tb.loadObj(
                        stonefrontOptions,
                        (model) => {

                            model.setCoords(
                                [-8.0, 40.5, 28700.0000]
                            );

                            model.setRotation({
                                x: 0,
                                y: 0,
                                z: 241
                            });

                            tb.add(model);

                            tb.altitudeStep = 0;

                        }
                    );


                    /* =========================
                       OLD HILL
                       ========================= */

                    var oldHillOptions = {

                        obj:
                            "https://cdn.glitch.global/f74434fa-8946-4fcc-8584-781241e68fd4/Old Hill Tower.gltf?v=1717419203458",

                        type: "gltf",

                        scale: 4000,

                        units: "scale",

                        rotation: {
                            x: 90,
                            y: 0,
                            z: 0
                        },

                        anchor: "centre"

                    };


                    tb.loadObj(
                        oldHillOptions,
                        (model) => {

                            model.setCoords(
                                [-7.45, 40.7, 35700.0000]
                            );

                            model.setRotation({
                                x: 0,
                                y: 0,
                                z: 241
                            });

                            tb.add(model);

                            tb.altitudeStep = 0;

                        }

                },


                render: function () {

                    tb.update();

                }

            });

        });


        /* =========================================================
           HILLSHADE + FOG
           ========================================================= */

        map.on("load", () => {


            map.addSource("dem", {

                type: "raster-dem",

                url:
                    "mapbox://fitzchevalric.68qxzm7k",

                tileSize: 256

            });


            map.addLayer(

                {

                    id: "hillshading",

                    source: "dem",

                    type: "hillshade",

                    paint: {

                        "hillshade-exaggeration": 0.02

                    }

                },

                "Biomes"

            );


            map.setFog({

                "range": [0.8, 10],

                "horizon-blend": 0.05,

                "color": "white",

                "high-color": "#add8e6",

                "space-color": "#367ab9",

                "star-intensity": 1

            });

        });


        /* =========================================================
           KANKA TOKEN BUTTON
           ========================================================= */

        class AccessTokenControl {


            onAdd(map) {

                this._map = map;


                this._container =
                    document.createElement("div");


                this._container.className =
                    "mapboxgl-ctrl mapboxgl-ctrl-group";


                const buttonContainer =
                    document.createElement("button");


                buttonContainer.className =
                    "mapboxgl-ctrl-set-token";


                buttonContainer.type =
                    "button";


                buttonContainer.ariaLabel =
                    "Set token";


                const iconContainer =
                    document.createElement("span");


                iconContainer.className =
                    "mapboxgl-ctrl-icon";


                iconContainer.title =
                    "Set Kanka token";


                buttonContainer.appendChild(
                    iconContainer
                );


                buttonContainer.addEventListener(
                    "click",
                    () => {

                        const token =
                            prompt(
                                "Enter Kanka access token"
                            );


                        if (token) {

                            localStorage.setItem(
                                KANKA_ACCESS_TOKEN_KEY,
                                token
                            );

                        }

                    }
                );


                /*
                    Zorg dat de token in dit bestand
                    de oude token in localStorage vervangt.
                */

                if (AccessTokenControl.DEFAULT_TOKEN) {

                    localStorage.setItem(

                        KANKA_ACCESS_TOKEN_KEY,

                        AccessTokenControl.DEFAULT_TOKEN

                    );

                }


                this._container.appendChild(
                    buttonContainer
                );


                return this._container;

            }


            onRemove() {

                if (
                    this._container &&
                    this._container.parentNode
                ) {

                    this._container.parentNode.removeChild(
                        this._container
                    );

                }


                this._map = undefined;

            }

        }


        /*
            VUL HIER JE HUIDIGE KANKA TOKEN IN.

            Ik zet hem hier bewust niet opnieuw in dit chatbericht.
        */

        AccessTokenControl.DEFAULT_TOKEN =
            "";


        /* =========================================================
           LAYER SWITCHER
           ========================================================= */

        class LayerSwitcherControl {


            constructor(layers) {

                this.layers =
                    layers ||
                    LayerSwitcherControl.LAYERS;

            }


            getDefaultPosition() {

                return "top-right";

            }


            onAdd(map) {

                this.map = map;


                this.controlContainer =
                    document.createElement("div");


                this.controlContainer.className =
                    "mapboxgl-ctrl mapboxgl-ctrl-group";


                this.mapLayersContainer =
                    document.createElement("div");


                this.mapLayersContainer.classList.add(
                    "mapboxgl-layer-list"
                );


                this.layerButtonContainer =
                    document.createElement("div");


                this.layerButtonContainer.classList.add(
                    "mapboxgl-layer-switcher"
                );


                this.layerButton =
                    document.createElement("button");


                this.layerButton.type =
                    "button";


                this.layerButton.classList.add(
                    "mapboxgl-ctrl-icon"
                );


                this.layerButton.classList.add(
                    "mapboxgl-layer-switcher-icon"
                );


                this.layerButton.addEventListener(
                    "click",
                    () => {

                        if (
                            this.mapLayersContainer.style.display ===
                            "none"
                        ) {

                            this.openModal();

                        } else {

                            this.closeModal();

                        }

                    }
                );


                this.layerButtonContainer.appendChild(
                    this.layerButton
                );


                this.controlContainer.appendChild(
                    this.layerButtonContainer
                );


                for (const layer of this.layers) {


                    const layerElement =
                        document.createElement(
                            "button"
                        );


                    layerElement.type =
                        "button";


                    layerElement.innerText =
                        layer.title;


                    layerElement.classList.add(
                        layer.title.replace(
                            /[^a-z0-9-]/gi,
                            "_"
                        )
                    );


                    layerElement.dataset.layerIds =
                        JSON.stringify(
                            layer.layerIds
                        );


                    layerElement.addEventListener(
                        "click",
                        (event) => {


                            const srcElement =
                                event.currentTarget;


                            const layerIds =
                                JSON.parse(
                                    srcElement.dataset.layerIds
                                );


                            if (
                                srcElement.classList.contains(
                                    "active"
                                )
                            ) {

                                srcElement.classList.remove(
                                    "active"
                                );


                                for (
                                    const layerId of layerIds
                                ) {

                                    map.setLayoutProperty(
                                        layerId,
                                        "visibility",
                                        "none"
                                    );

                                }

                            } else {

                                srcElement.classList.add(
                                    "active"
                                );


                                for (
                                    const layerId of layerIds
                                ) {

                                    map.setLayoutProperty(
                                        layerId,
                                        "visibility",
                                        "visible"
                                    );

                                }

                            }

                        }
                    );


                    layerElement.classList.add(
                        "active"
                    );


                    this.mapLayersContainer.appendChild(
                        layerElement
                    );

                }


                this.controlContainer.appendChild(
                    this.mapLayersContainer
                );


                this.closeModal();


                return this.controlContainer;

            }


            onRemove() {

                if (
                    this.controlContainer &&
                    this.controlContainer.parentNode
                ) {

                    this.controlContainer.parentNode.removeChild(
                        this.controlContainer
                    );

                }

                this.map = undefined;

            }


            closeModal() {

                this.mapLayersContainer.style.display =
                    "none";

            }


            openModal() {

                this.mapLayersContainer.style.display =
                    "block";

            }

        }


        LayerSwitcherControl.LAYERS = [

            {
                title: "States",
                layerIds: ["States"]
            },

            {
                title: "Towns",
                layerIds: [
                    "Town names",
                    "Capitals"
                ]
            }

        ];


        map.addControl(
            new LayerSwitcherControl()
        );


        map.addControl(
            new AccessTokenControl()
        );


        /* =========================================================
           KANKA LOCATION CLICK
           ========================================================= */

        map.on(

            "click",

            [
                "Town names",
                "Capitals",
                "clickable"
            ],

            async (e) => {


                const feature =
                    e.features[0];


                if (!feature) {
                    return;
                }


                /*
                    Niet reageren wanneer het
                    symbool verborgen is.
                */

                if (
                    feature.layer.paint &&
                    feature.layer.paint[
                        "icon-opacity"
                    ] === 0
                ) {

                    return;

                }


                const kankaAccessToken =
                    localStorage.getItem(
                        KANKA_ACCESS_TOKEN_KEY
                    );


                if (!kankaAccessToken) {

                    createLocationPopup(
                        feature
                    );

                    return;

                }


                try {


                    /* =========================
                       1. Zoek de entity
                       ========================= */

                    const entityResponse =
                        await fetch(

                            "https://api.kanka.io/1.0/campaigns/196997/entities?" +

                            new URLSearchParams({

                                types:
                                    "location",

                                name:
                                    feature.properties.Burg

                            }),

                            {

                                method: "GET",

                                headers: {

                                    "Accept":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${kankaAccessToken}`

                                }

                            }

                        );


                    if (!entityResponse.ok) {

                        const errorText =
                            await entityResponse.text();


                        console.error(
                            "Kanka entity API error:",
                            entityResponse.status,
                            errorText
                        );


                        throw new Error(
                            `Kanka entity request returned ${entityResponse.status}`
                        );

                    }


                    const entityData =
                        await entityResponse.json();


                    console.log(
                        "Kanka entity response:",
                        entityData
                    );


                    if (
                        !entityData.data ||
                        entityData.data.length === 0
                    ) {

                        createLocationPopup(
                            feature
                        );

                        return;

                    }


                    const entity =
                        entityData.data[0];


                    console.log(
                        "Kanka entity:",
                        entity
                    );


                    /*
                        Dit is de belangrijke ID.

                        entity.id is de algemene
                        entity-ID.

                        child_id is de echte
                        location-ID.
                    */

                    const locationId =
                        entity.child_id;


                    if (!locationId) {

                        console.warn(
                            "Kanka entity heeft geen child_id:",
                            entity
                        );


                        createLocationPopup(

                            feature,

                            entity.urls?.view

                        );


                        return;

                    }


                    /* =========================
                       2. Haal de echte location op
                       ========================= */

                    const locationResponse =
                        await fetch(

                            `https://api.kanka.io/1.0/campaigns/196997/locations/${locationId}`,

                            {

                                method: "GET",

                                headers: {

                                    "Accept":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${kankaAccessToken}`

                                }

                            }

                        );


                    if (!locationResponse.ok) {

                        const errorText =
                            await locationResponse.text();


                        console.error(
                            "Kanka location API error:",
                            locationResponse.status,
                            errorText
                        );


                        throw new Error(
                            `Kanka location request returned ${locationResponse.status}`
                        );

                    }


                    const locationData =
                        await locationResponse.json();


                    const location =
                        locationData.data;


                    console.log(
                        "Kanka location:",
                        location
                    );


                    /*
                        Gebruik eerst full image.

                        Als die niet bestaat:
                        gebruik thumbnail.
                    */

                    const imageUrl =

                        location.image_full ||

                        location.image_thumb ||

                        null;


                    console.log(
                        "Kanka location image URL:",
                        imageUrl
                    );


                    createLocationPopup(

                        feature,

                        entity.urls?.view,

                        imageUrl

                    );


                } catch (error) {


                    console.error(
                        "Error loading Kanka location:",
                        error
                    );


                    createLocationPopup(
                        feature
                    );

                }

            }

        );


        /* =========================================================
           POPUP
           ========================================================= */

        function createLocationPopup(
            feature,
            link,
            imageUrl
        ) {


            const name =
                feature.properties.Burg || "";


            const population =
                feature.properties.Population || "";


            const state =
                feature.properties.State || "";


            const culture =
                feature.properties.Culture || "";


            /* afbeelding */

            const imageHtml =
                imageUrl
                    ? `
                        <div class="location-popup-image-wrapper">

                            <img
                                class="location-popup-image"
                                src="${imageUrl}"
                                alt="${name}"
                            >

                        </div>
                    `
                    : "";


            /* titel */

            const titleHtml =
                link
                    ? `
                        <h3 class="location-popup-title">

                            <a
                                href="${link}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                ${name}
                            </a>

                        </h3>
                    `
                    : `
                        <h3 class="location-popup-title">
                            ${name}
                        </h3>
                    `;


            /* tags */

            const tagsHtml =
                state || culture
                    ? `
                        <div class="location-popup-tags">

                            ${
                                state
                                    ? `
                                        <span class="location-popup-tag">
                                            ${state}
                                        </span>
                                    `
                                    : ""
                            }

                            ${
                                culture
                                    ? `
                                        <span class="location-popup-tag">
                                            ${culture}
                                        </span>
                                    `
                                    : ""
                            }

                        </div>
                    `
                    : "";


            /* info */

            const populationHtml =
                population
                    ? `
                        <div class="location-popup-row">

                            <span class="location-popup-label">
                                Population
                            </span>

                            <span class="location-popup-value">
                                ${population}
                            </span>

                        </div>
                    `
                    : "";


            const html = `

                ${imageHtml}

                <div class="location-popup-content">

                    ${titleHtml}

                    ${tagsHtml}

                    <div class="location-popup-info">

                        ${populationHtml}

                    </div>

                </div>

            `;


            new mapboxgl.Popup({

                offset: [0, -15],

                maxWidth: "320px"

            })

                .setLngLat(
                    feature.geometry.coordinates
                )

                .setHTML(html)

                .addTo(map);

        }

    </script>

</body>

</html>
